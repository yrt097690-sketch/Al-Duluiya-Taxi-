<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي الضلوعية - لوحة الإدارة والتتبع</title>
    <!-- مكتبة Bootstrap للتصميم -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f8f9fa; font-family: 'Tahoma', sans-serif; }
        #map { height: 400px; width: 100%; border-radius: 8px; }
        .login-card { max-width: 400px; margin: 100px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fff; }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول للمدير -->
    <div id="loginSection" class="container">
        <div class="login-card">
            <h3 class="text-center mb-4 text-primary"><i class="fa-solid fa-taxi"></i> تكسي الضلوعية</h3>
            <h5 class="text-center mb-4 text-secondary">تسجيل دخول المدير</h5>
            <div id="loginError" class="alert alert-danger d-none">اسم المستخدم أو كلمة المرور غير صحيحة</div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" id="username" class="form-control" required placeholder="admin">
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="password" class="form-control" required placeholder="12345">
                </div>
                <button type="submit" class="btn btn-primary w-100">دخول للوحة التحكم</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية (مخفية لحين تسجيل الدخول) -->
    <div id="dashboardSection" class="container my-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-gauge"></i> لوحة تحكم تكسي الضلوعية</h2>
            <button id="logoutBtn" class="btn btn-danger btn-sm"><i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج</button>
        </div>

        <div class="row">
            <!-- إضافة سائق جديد وحفظ بياناته -->
            <div class="col-md-4 mb-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="mb-3 text-primary"><i class="fa-solid fa-user-plus"></i> إضافة سائق جديد</h5>
                    <form id="driverForm">
                        <div class="mb-2">
                            <label class="form-label">اسم السائق</label>
                            <input type="text" id="driverName" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">رقم الهاتف</label>
                            <input type="text" id="driverPhone" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">نوع السيارة ورقمها</label>
                            <input type="text" id="carInfo" class="form-control" required placeholder="مثال: صالون - بغداد 12345">
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-2">حفظ السائق</button>
                    </form>
                </div>

                <!-- قائمة السواق المسجلين -->
                <div class="card p-3 shadow-sm mt-3">
                    <h5 class="mb-3 text-secondary"><i class="fa-solid fa-list"></i> السواق النشطون</h5>
                    <ul id="driversList" class="list-group">
                        <!-- يتم تعبئتها ديناميكياً -->
                    </ul>
                </div>
            </div>

            <!-- خريطة تتبع أماكن تواجد السواق -->
            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <h5 class="mb-3 text-primary"><i class="fa-solid fa-map-location-dot"></i> خريطة تتبع الضلوعية</h5>
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- جافاسكريبت المرفقات والخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // بيانات تجريبية أولية للسواق وأماكن تواجدهم في الضلوعية
        let drivers = [
            { id: 1, name: "علي الجبوري", phone: "07700000000", car: "سفاري - 55421", lat: 34.0205, lng: 44.1501 },
            { id: 2, name: "عمر الدليمي", phone: "07800000000", car: "تويوتا - 12345", lat: 34.0250, lng: 44.1550 }
        ];

        // تهيئة الخريطة (مركزة على الضلوعية مبدئياً)
        let map = L.map('map').setView([34.022, 44.152], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let markers = {};

        function updateMapMarkers() {
            // مسح العلامات القديمة
            for (let id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};
            let listHtml = '';

            drivers.forEach(driver => {
                // إضافة علامة على الخريطة
                let marker = L.marker([driver.lat, driver.lng]).addTo(map)
                    .bindPopup(`<b>${driver.name}</b><br>${driver.car}<br>الهاتف: ${driver.phone}`);
                markers[driver.id] = marker;

                // إضافة للقائمة الجانبية
                listHtml += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${driver.name}</strong><br>
                        <small class="text-muted">${driver.car}</small>
                    </div>
                    <span class="badge bg-success rounded-pill">متواجد</span>
                </li>`;
            });

            document.getElementById('driversList').innerHTML = listHtml;
        }

        // التعامل مع تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            // بيانات افتراضية للمدير
            if (user === 'admin' && pass === '12345') {
                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('dashboardSection').classList.remove('d-none');
                updateMapMarkers();
                setTimeout(() => { map.invalidateSize(); }, 200);
            } else {
                document.getElementById('loginError').classList.remove('d-none');
            }
        });

        // تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('dashboardSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
        });

        // حفظ سائق جديد
        document.getElementById('driverForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let name = document.getElementById('driverName').value;
            let phone = document.getElementById('driverPhone').value;
            let car = document.getElementById('carInfo').value;

            // إعطاء إحداثيات عشوائية قريبة في الضلوعية للسائق الجديد
            let newDriver = {
                id: drivers.length + 1,
                name: name,
                phone: phone,
                car: car,
                lat: 34.022 + (Math.random() - 0.5) * 0.01,
                lng: 44.152 + (Math.random() - 0.5) * 0.01
            };

            drivers.push(newDriver);
            updateMapMarkers();
            this.reset();
            alert("تم حفظ بيانات السائق بنجاح وإضافته للخريطة!");
        });
    </script>
</body>
</html>
